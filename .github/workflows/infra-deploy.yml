name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          clean: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::${{ secrets.ACC_ID }}:role/GitHubActionsRole
          role-session-name: GitHubActionsSession
          audience: sts.amazonaws.com

      - name: Terraform Init, Plan, and Apply
        id: terraform
        run: |
          terraform init -backend-config=backend.hcl -input=false -reconfigure
          terraform validate
          terraform plan -out=tfplan -input=false
          terraform apply -input=false -auto-approve tfplan
          rm -f tfplan
          echo "caprover_instance_id=$(terraform output -raw caprover_instance_id)" >> $GITHUB_OUTPUT
          echo "gitlab_instance_id=$(terraform output -raw gitlab_instance_id)" >> $GITHUB_OUTPUT
          echo "vpc_cidr=$(terraform output -raw vpc_cidr)" >> $GITHUB_OUTPUT
          echo "ansible_s3_bucket=$(terraform output -raw ansible_ssm_s3_bucket_name)" >> $GITHUB_OUTPUT

      - name: Install and Verify Ansible Dependencies
        id: ansible_install
        working-directory: ansible
        run: |
          echo "--- Installing Ansible and its dependencies ---"
          python3 -m venv /home/runner/ansible_venv
          /home/runner/ansible_venv/bin/pip install --upgrade pip
          /home/runner/ansible_venv/bin/pip install \
            ansible-core==2.15.10 \
            boto3 \
            botocore
          
          echo "--- Installing Ansible Collections ---"
          /home/runner/ansible_venv/bin/ansible-galaxy collection install amazon.aws:==6.5.0 community.general -p ./collections -vvv

          echo "--- Verifying Collection Installation ---"
          # This command will fail the job if the plugin file doesn't exist
          find ./collections -name "aws_ssm.py" -print -exec echo "Plugin file found!" \; -exec exit 0 \; || (echo "::error::aws_ssm.py not found in collections!" && exit 1)

      - name: Run Ansible Configuration
        working-directory: ansible
        env:
          ANSIBLE_COLLECTIONS_PATH: ./collections
          AWS_REGION: eu-north-1
        run: |
          # Create an in-memory inventory string
          INVENTORY_STRING="[caprover]
          ${{ steps.terraform.outputs.caprover_instance_id }}
          [gitlab]
          ${{ steps.terraform.outputs.gitlab_instance_id }}"

          echo "--- Ansible Version and Paths ---"
          /home/runner/ansible_venv/bin/ansible --version

          echo "--- Checking Plugin Discovery ---"
          # This command will fail if Ansible cannot discover the plugin
          /home/runner/ansible_venv/bin/ansible-doc -t connection amazon.aws.aws_ssm

          echo "--- Running Ansible Playbook ---"
          /home/runner/ansible_venv/bin/ansible-playbook \
            -i "${INVENTORY_STRING}" \
            playbook.yml -vvv \
            --vault-password-file <(echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}") \
            --extra-vars "ansible_connection=amazon.aws.aws_ssm ansible_aws_ssm_s3_bucket_name=${{ steps.terraform.outputs.ansible_s3_bucket }} ansible_user=ubuntu domain_name=${{ secrets.DOMAIN_NAME }} vpc_cidr=${{ steps.terraform.outputs.vpc_cidr }}"