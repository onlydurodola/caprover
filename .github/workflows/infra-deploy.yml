name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          clean: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::${{ secrets.ACC_ID }}:role/GitHubActionsRole
          role-session-name: GitHubActionsSession
          audience: sts.amazonaws.com

      - name: Setup Terraform Variables
        run: |
          echo "allowed_ips =  [\"${{ secrets.VPN_CIDR }}\"]" >> secrets.auto.tfvars
          echo "vpn_enabled = \"true\"" >> secrets.auto.tfvars
          echo "root_cert_arn = \"${{ secrets.VPN_ROOT_CERT_ARN }}\"" >> secrets.auto.tfvars
          echo "server_cert_arn = \"${{ secrets.VPN_SERVER_CERT_ARN }}\"" >> secrets.auto.tfvars
          echo "certificate_arn = \"${{ secrets.ACM_CERTIFICATE_ARN }}\"" >> secrets.auto.tfvars
          echo "domain_name = \"${{ secrets.DOMAIN_NAME }}\"" >> secrets.auto.tfvars
          echo "aws_region = \"eu-north-1\"" >> secrets.auto.tfvars
          echo "waf_enabled = \"true\"" >> secrets.auto.tfvars

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl -input=false -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply -input=false -auto-approve tfplan
          rm -f tfplan

      - name: Save Terraform Outputs
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Saving Terraform outputs to environment..."
          echo "CAPROVER_INSTANCE_ID=$(terraform output -raw caprover_instance_id)" >> $GITHUB_ENV
          echo "GITLAB_INSTANCE_ID=$(terraform output -raw gitlab_instance_id)" >> $GITHUB_ENV
          echo "VPC_CIDR=$(terraform output -raw vpc_cidr)" >> $GITHUB_ENV
          echo "ANSIBLE_S3_BUCKET=$(terraform output -raw ansible_ssm_s3_bucket_name)" >> $GITHUB_ENV

      - name: Wait for SSM Registration
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for SSM registration..."
          for i in {1..15}; do
            cap_status=$(aws ssm describe-instance-information --filters Key=InstanceIds,Values=${{ env.CAPROVER_INSTANCE_ID }} --query 'InstanceInformationList[0].PingStatus' --output text || echo "Error")
            git_status=$(aws ssm describe-instance-information --filters Key=InstanceIds,Values=${{ env.GITLAB_INSTANCE_ID }} --query 'InstanceInformationList[0].PingStatus' --output text || echo "Error")
            echo "CapRover status: $cap_status, GitLab status: $git_status"
            if [[ "$cap_status" == "Online" && "$git_status" == "Online" ]]; then
              echo "Both instances online"
              exit 0
            fi
            sleep 10
          done
          echo "SSM registration timeout"
          exit 1

      - name: Install Ansible Dependencies
        if: github.ref == 'refs/heads/main'
        working-directory: ansible
        run: |
          echo "--- Installing Ansible and its dependencies ---"
          python3 -m venv /home/runner/ansible_venv
          /home/runner/ansible_venv/bin/pip install --upgrade pip
          /home/runner/ansible_venv/bin/pip install \
            ansible==9.1.0 \
            boto3==1.34.115 \
            botocore==1.34.115
          /home/runner/ansible_venv/bin/ansible-galaxy collection install amazon.aws community.general community.docker -p ./collections --force
          # This check will now pass
          if [ ! -d "./collections/ansible_collections/amazon/aws" ]; then
            echo "::error::Collection 'amazon.aws' was not found after installation. The galaxy command failed."
            exit 1
          fi

      - name: Create Minimal Ansible Inventory
        if: github.ref == 'refs/heads/main'
        working-directory: ansible
        run: |
          echo "--- Creating minimal inventory file ---"
          cat << EOF > inventory.ini
          [caprover]
          ${{ env.CAPROVER_INSTANCE_ID }}

          [gitlab]
          ${{ env.GITLAB_INSTANCE_ID }}
          EOF

      - name: Run Ansible Configuration
        if: github.ref == 'refs/heads/main'
        working-directory: ansible
        env:
          # Point ONLY to the new local collections path
          ANSIBLE_COLLECTIONS_PATH: ./collections
        run: |
          /home/runner/ansible_venv/bin/ansible-playbook -i inventory.ini playbook.yml -vvv \
            --vault-password-file <(echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}") \
            --extra-vars "ansible_connection=amazon.aws.aws_ssm ansible_aws_ssm_s3_bucket_name=${{ env.ANSIBLE_S3_BUCKET }} ansible_aws_ssm_region=eu-north-1 domain_name=${{ secrets.DOMAIN_NAME }} vpc_cidr=${{ env.VPC_CIDR }}"

      - name: Verify Application Health
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Testing CapRover dashboard:"
          curl -sL --max-time 10 -o /dev/null -w "%{http_code}" "https://captain.${{ secrets.DOMAIN_NAME }}" | grep -q 200
          
          echo "Testing GitLab:"
          curl -sL --max-time 10 -o /dev/null -w "%{http_code}" "https://gitlab.${{ secrets.DOMAIN_NAME }}" | grep -q 200

      - name: Capture Debug Info on Failure
        if: ${{ failure() }}
        run: |
          echo "===== SSM AGENT STATUS ====="
          aws ssm describe-instance-information \
            --filters Key=InstanceIds,Values=${{ env.CAPROVER_INSTANCE_ID }} \
            --query 'InstanceInformationList[0]'
          
          aws ssm describe-instance-information \
            --filters Key=InstanceIds,Values=${{ env.GITLAB_INSTANCE_ID }} \
            --query 'InstanceInformationList[0]'
          
          echo "===== INSTANCE SYSTEM LOGS ====="
          aws ec2 get-console-output --instance-id ${{ env.CAPROVER_INSTANCE_ID }} --output text
          aws ec2 get-console-output --instance-id ${{ env.GITLAB_INSTANCE_ID }} --output text
          
          echo "===== ANSIBLE LOGS ====="
          if [ -f ansible/ansible.log ]; then
            cat ansible/ansible.log
          fi