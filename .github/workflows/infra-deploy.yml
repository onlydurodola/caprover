name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          clean: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::${{ secrets.ACC_ID }}:role/GitHubActionsRole
          role-session-name: GitHubActionsSession
          audience: sts.amazonaws.com

      - name: Setup Terraform Variables
        run: |
          echo "allowed_ips =  [\"${{ secrets.VPN_CIDR }}\"]" >> secrets.auto.tfvars
          echo "vpn_enabled = \"true\"" >> secrets.auto.tfvars
          echo "root_cert_arn = \"${{ secrets.VPN_ROOT_CERT_ARN }}\"" >> secrets.auto.tfvars
          echo "server_cert_arn = \"${{ secrets.VPN_SERVER_CERT_ARN }}\"" >> secrets.auto.tfvars
          echo "certificate_arn = \"${{ secrets.ACM_CERTIFICATE_ARN }}\"" >> secrets.auto.tfvars
          echo "domain_name = \"${{ secrets.DOMAIN_NAME }}\"" >> secrets.auto.tfvars
          echo "aws_region = \"eu-north-1\"" >> secrets.auto.tfvars
          echo "waf_enabled = \"true\"" >> secrets.auto.tfvars

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl -input=false -reconfigure

      - name: Terraform Format
        run: |
          terraform fmt -recursive
          find . -name "*.tf" -exec terraform fmt -check -diff {} +

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply -input=false -auto-approve tfplan
          rm -f tfplan

      - name: Save Terraform Outputs
        if: github.ref == 'refs/heads/main'
        run: |
          CAPROVER_IP=$(terraform output -raw caprover_instance_ip)
          GITLAB_IP=$(terraform output -raw gitlab_instance_ip)
          CAPROVER_SG_ID=$(terraform output -raw caprover_sg_id)
          GITLAB_SG_ID=$(terraform output -raw gitlab_sg_id)
          ALB_DNS=$(terraform output -raw alb_dns_name)
          VPC_CIDR=$(terraform output -raw vpc_cidr)
          CAPROVER_INSTANCE_ID=$(terraform output -raw caprover_instance_id)
          GITLAB_INSTANCE_ID=$(terraform output -raw gitlab_instance_id)
          
          echo "CAPROVER_IP=$CAPROVER_IP" >> $GITHUB_ENV
          echo "GITLAB_IP=$GITLAB_IP" >> $GITHUB_ENV
          echo "CAPROVER_SG_ID=$CAPROVER_SG_ID" >> $GITHUB_ENV
          echo "GITLAB_SG_ID=$GITLAB_SG_ID" >> $GITHUB_ENV
          echo "ALB_DNS=$ALB_DNS" >> $GITHUB_ENV
          echo "VPC_CIDR=$VPC_CIDR" >> $GITHUB_ENV 
          echo "CAPROVER_INSTANCE_ID=$CAPROVER_INSTANCE_ID" >> $GITHUB_ENV
          echo "GITLAB_INSTANCE_ID=$GITLAB_INSTANCE_ID" >> $GITHUB_ENV

      - name: Wait for SSM Registration
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for SSM registration..."
          for i in {1..15}; do
            cap_status=$(aws ssm describe-instance-information \
              --filters Key=InstanceIds,Values=${{ env.CAPROVER_INSTANCE_ID }} \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)
            
            git_status=$(aws ssm describe-instance-information \
              --filters Key=InstanceIds,Values=${{ env.GITLAB_INSTANCE_ID }} \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)
            
            echo "CapRover status: $cap_status, GitLab status: $git_status"
            
            if [[ "$cap_status" == "Online" && "$git_status" == "Online" ]]; then
              echo "Both instances online"
              exit 0
            fi
            sleep 10
          done
          echo "SSM registration timeout"
          exit 1

      - name: Install Ansible Dependencies
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv /home/runner/ansible_venv
          /home/runner/ansible_venv/bin/pip install ansible-core==2.14.2 boto3==1.34.0 botocore==1.34.0
          /home/runner/ansible_venv/bin/ansible-galaxy collection install community.aws:>=6.0.0 community.general community.docker

      - name: Debug Python Environment
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Virtual Environment Python version:"
          /home/runner/ansible_venv/bin/python --version
          echo "Virtual Environment Pip version:"
          /home/runner/ansible_venv/bin/pip --version
          echo "Virtual Environment Installed packages:"
          /home/runner/ansible_venv/bin/pip list
          echo "Ansible executable path:"
          which /home/runner/ansible_venv/bin/ansible-playbook
          echo "Verify boto3 installation:"
          /home/runner/ansible_venv/bin/python -c "import boto3; print('boto3 version:', boto3.__version__)"

      - name: Verify Ansible Collections
        if: github.ref == 'refs/heads/main'
        run: |
          /home/runner/ansible_venv/bin/ansible-galaxy collection list | grep -E 'community.aws|community.general|community.docker'

      - name: Test SSM Connection
        if: github.ref == 'refs/heads/main'
        run: |
          aws ssm send-command \
            --instance-ids ${{ env.CAPROVER_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo SSM-TEST-SUCCESS-CAPROVER"]' \
            --region eu-north-1 \
            --output text
          
          aws ssm send-command \
            --instance-ids ${{ env.GITLAB_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo SSM-TEST-SUCCESS-GITLAB"]' \
            --region eu-north-1 \
            --output text

      - name: Create Ansible Inventory
        if: github.ref == 'refs/heads/main'
        working-directory: ansible
        run: |
          cat << EOF > inventory.ini
          [caprover]
          ${{ env.CAPROVER_INSTANCE_ID }} ansible_connection=community.aws.aws_ssm ansible_region=eu-north-1

          [gitlab]
          ${{ env.GITLAB_INSTANCE_ID }} ansible_connection=community.aws.aws_ssm ansible_region=eu-north-1
          EOF
          
          echo "Inventory created:"
          cat inventory.ini

      - name: Run Ansible Configuration
        if: github.ref == 'refs/heads/main'
        working-directory: ansible
        run: |
          /home/runner/ansible_venv/bin/ansible-playbook -i inventory.ini playbook.yml -vvv \
            --vault-password-file <(echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}") \
            --extra-vars "domain_name=${{ secrets.DOMAIN_NAME }} vpc_cidr=${{ env.VPC_CIDR }}" \
            | tee ansible.log

      - name: Verify Application Health
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Testing CapRover dashboard:"
          curl -sL -o /dev/null -w "%{http_code}" "https://captain.${{ secrets.DOMAIN_NAME }}" | grep -q 200
          
          echo "Testing GitLab:"
          curl -sL -o /dev/null -w "%{http_code}" "https://gitlab.${{ secrets.DOMAIN_NAME }}" | grep -q 200

      - name: Capture Debug Info on Failure
        if: ${{ failure() }}
        run: |
          echo "===== SSM AGENT STATUS ====="
          aws ssm describe-instance-information \
            --filters Key=InstanceIds,Values=${{ env.CAPROVER_INSTANCE_ID }} \
            --query 'InstanceInformationList[0]'
          
          aws ssm describe-instance-information \
            --filters Key=InstanceIds,Values=${{ env.GITLAB_INSTANCE_ID }} \
            --query 'InstanceInformationList[0]'
          
          echo "===== INSTANCE SYSTEM LOGS ====="
          aws s ensure the virtual environment is used consistently.ec2 get-console-output --instance-id ${{ env.CAPROVER_INSTANCE_ID }} --output text
          aws ec2 get-console-output --instance-id ${{ env.GITLAB_INSTANCE_ID }} --output text
          
          echo "===== ANSIBLE LOGS ====="
          if [ -f ansible.log ]; then
            cat ansible.log
          fi