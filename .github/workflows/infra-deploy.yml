name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          clean: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::${{ secrets.ACC_ID }}:role/GitHubActionsRole
          role-session-name: GitHubActionsSession
          audience: sts.amazonaws.com

      - name: Setup Terraform Variables
        working-directory: terraform
        run: |
          echo "allowed_ips =  [\"${{ secrets.VPN_CIDR }}\"]" >> secrets.auto.tfvars
          echo "vpn_enabled = \"true\"" >> secrets.auto.tfvars
          echo "root_cert_arn = \"${{ secrets.VPN_ROOT_CERT_ARN }}\"" >> secrets.auto.tfvars
          echo "server_cert_arn = \"${{ secrets.VPN_SERVER_CERT_ARN }}\"" >> secrets.auto.tfvars
          echo "certificate_arn = \"${{ secrets.ACM_CERTIFICATE_ARN }}\"" >> secrets.auto.tfvars
          echo "domain_name = \"${{ secrets.DOMAIN_NAME }}\"" >> secrets.auto.tfvars
          echo "aws_region = \"eu-north-1\"" >> secrets.auto.tfvars
          echo "waf_enabled = \"true\"" >> secrets.auto.tfvars

      - name: Terraform Init, Plan, and Apply
        working-directory: terraform
        run: |
          terraform init -backend-config=backend.hcl -input=false -reconfigure
          terraform validate
          terraform plan -out=tfplan -input=false
          terraform apply -input=false -auto-approve tfplan
          rm -f tfplan

      - name: Save Terraform Outputs
        id: terraform_outputs
        working-directory: terraform
        run: |
          echo "caprover_instance_id=$(terraform output -raw caprover_instance_id)" >> $GITHUB_OUTPUT
          echo "gitlab_instance_id=$(terraform output -raw gitlab_instance_id)" >> $GITHUB_OUTPUT
          echo "vpc_cidr=$(terraform output -raw vpc_cidr)" >> $GITHUB_OUTPUT
          echo "ansible_s3_bucket=$(terraform output -raw ansible_ssm_s3_bucket_name)" >> $GITHUB_OUTPUT

      - name: Run Ansible Playbook in Execution Environment
        uses: redhat-actions/ansible-playbook@v2
        with:
          workdir: ansible
          playbook: playbook.yml
          galaxy: requirements.yml
          requirements-txt: requirements.txt
          inventory: |
            [all:vars]
            ansible_connection = amazon.aws.aws_ssm
            ansible_aws_ssm_s3_bucket_name = ${{ steps.terraform_outputs.outputs.ansible_s3_bucket }}
            ansible_aws_ssm_region = eu-north-1
            ansible_user = ubuntu
            ansible_python_interpreter = /usr/bin/python3

            [caprover]
            ${{ steps.terraform_outputs.outputs.caprover_instance_id }}

            [gitlab]
            ${{ steps.terraform_outputs.outputs.gitlab_instance_id }}
          extra_vars: "domain_name=${{ secrets.DOMAIN_NAME }} vpc_cidr=${{ steps.terraform_outputs.outputs.vpc_cidr }}"
          vault_password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}