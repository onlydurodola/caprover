name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          clean: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::${{ secrets.ACC_ID }}:role/GitHubActionsRole
          role-session-name: GitHubActionsSession
          audience: sts.amazonaws.com

      - name: Setup Terraform Variables
        run: |
          echo "allowed_ips =  [\"${{ secrets.VPN_CIDR }}\"]" >> secrets.auto.tfvars
          echo "vpn_enabled = \"true\"" >> secrets.auto.tfvars
          echo "root_cert_arn = \"${{ secrets.VPN_ROOT_CERT_ARN }}\"" >> secrets.auto.tfvars
          echo "server_cert_arn = \"${{ secrets.VPN_SERVER_CERT_ARN }}\"" >> secrets.auto.tfvars
          echo "certificate_arn = \"${{ secrets.ACM_CERTIFICATE_ARN }}\"" >> secrets.auto.tfvars
          echo "domain_name = \"${{ secrets.DOMAIN_NAME }}\"" >> secrets.auto.tfvars
          echo "aws_region = \"eu-north-1\"" >> secrets.auto.tfvars
          echo "waf_enabled = \"true\"" >> secrets.auto.tfvars

      - name: Terraform Init, Plan, and Apply
        id: terraform
        run: |
          terraform init -backend-config=backend.hcl -input=false -reconfigure
          terraform validate
          terraform plan -out=tfplan -input=false
          terraform apply -input=false -auto-approve tfplan
          rm -f tfplan
          echo "caprover_instance_id=$(terraform output -raw caprover_instance_id)" >> $GITHUB_OUTPUT
          echo "gitlab_instance_id=$(terraform output -raw gitlab_instance_id)" >> $GITHUB_OUTPUT
          echo "vpc_cidr=$(terraform output -raw vpc_cidr)" >> $GITHUB_OUTPUT
          echo "ansible_s3_bucket=$(terraform output -raw ansible_ssm_s3_bucket_name)" >> $GITHUB_OUTPUT

      - name: Wait for SSM Registration
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for SSM registration..."
          for i in {1..15}; do
            cap_status=$(aws ssm describe-instance-information --filters Key=InstanceIds,Values=${{ steps.terraform.outputs.caprover_instance_id }} --query 'InstanceInformationList[0].PingStatus' --output text || echo "Error")
            git_status=$(aws ssm describe-instance-information --filters Key=InstanceIds,Values=${{ steps.terraform.outputs.gitlab_instance_id }} --query 'InstanceInformationList[0].PingStatus' --output text || echo "Error")
            echo "CapRover status: $cap_status, GitLab status: $git_status"
            if [[ "$cap_status" == "Online" && "$git_status" == "Online" ]]; then
              echo "Both instances online"
              exit 0
            fi
            sleep 10
          done
          echo "SSM registration timeout"
          exit 1

      - name: Install Ansible Dependencies
        working-directory: ansible
        run: |
          echo "--- Installing Ansible and its dependencies ---"
          python3 -m venv /home/runner/ansible_venv
          /home/runner/ansible_venv/bin/pip install --upgrade pip
          /home/runner/ansible_venv/bin/pip install \
            ansible-core==2.15.10 \
            boto3 \
            botocore
          /home/runner/ansible_venv/bin/ansible-galaxy collection install amazon.aws:==6.5.0 community.general community.docker -p ./collections

      - name: Create Ansible Inventory and Config
        working-directory: ansible
        run: |
          echo "--- Creating ansible.cfg ---"
          cat << EOF > ansible.cfg
          [defaults]
          inventory = inventory.ini
          host_key_checking = False
          deprecation_warnings = False
          [ssm_connection]
          s3_bucket_name = ${{ steps.terraform.outputs.ansible_s3_bucket }}
          region = eu-north-1
          EOF

          echo "--- Creating inventory.ini ---"
          cat << EOF > inventory.ini
          [all:vars]
          ansible_connection = amazon.aws.aws_ssm
          ansible_user = ubuntu
          ansible_python_interpreter = /usr/bin/python3

          [caprover]
          ${{ steps.terraform.outputs.caprover_instance_id }}

          [gitlab]
          ${{ steps.terraform.outputs.gitlab_instance_id }}
          EOF

      - name: Run Ansible Configuration
        working-directory: ansible
        env:
          ANSIBLE_COLLECTIONS_PATH: ./collections
        run: |
          /home/runner/ansible_venv/bin/ansible-playbook -i inventory.ini playbook.yml -vvv \
            --vault-password-file <(echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}") \
            --extra-vars "domain_name=${{ secrets.DOMAIN_NAME }} vpc_cidr=${{ steps.terraform.outputs.vpc_cidr }}"
            
      - name: Verify Application Health
        working-directory: terraform
        run: |
          echo "Testing CapRover dashboard:"
          curl -sL --max-time 10 -o /dev/null -w "%{http_code}" "https://captain.${{ secrets.DOMAIN_NAME }}" | grep -q 200
          
          echo "Testing GitLab:"
          curl -sL --max-time 10 -o /dev/null -w "%{http_code}" "https://gitlab.${{ secrets.DOMAIN_NAME }}" | grep -q 200

      - name: Capture Debug Info on Failure
        if: ${{ failure() }}
        working-directory: terraform
        run: |
          echo "===== SSM AGENT STATUS ====="
          aws ssm describe-instance-information \
            --filters Key=InstanceIds,Values=${{ steps.terraform.outputs.caprover_instance_id }} \
            --query 'InstanceInformationList[0]'
          
          aws ssm describe-instance-information \
            --filters Key=InstanceIds,Values=${{ steps.terraform.outputs.gitlab_instance_id }} \
            --query 'InstanceInformationList[0]'
          
          echo "===== INSTANCE SYSTEM LOGS ====="
          aws ec2 get-console-output --instance-id ${{ steps.terraform.outputs.caprover_instance_id }} --output text
          aws ec2 get-console-output --instance-id ${{ steps.terraform.outputs.gitlab_instance_id }} --output text
          
          echo "===== ANSIBLE LOGS ====="
          if [ -f ../ansible/ansible.log ]; then
            cat ../ansible/ansible.log
          fi