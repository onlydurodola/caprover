name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'
  

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          clean: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::${{ secrets.ACC_ID }}:role/GitHubActionsRole
          role-session-name: GitHubActionsSession
          audience: sts.amazonaws.com
        
      - name: Setup Terraform Variables
        run: |
          echo "allowed_ips =  [\"${{ secrets.VPN_CIDR }}\"]" >> secrets.auto.tfvars
          echo "vpn_enabled = \"true\"" >> secrets.auto.tfvars
          echo "root_cert_arn = \"${{ secrets.VPN_ROOT_CERT_ARN }}\"" >> secrets.auto.tfvars
          echo "server_cert_arn = \"${{ secrets.VPN_SERVER_CERT_ARN }}\"" >> secrets.auto.tfvars
          echo "certificate_arn = \"${{ secrets.ACM_CERTIFICATE_ARN }}\"" >> secrets.auto.tfvars
          echo "domain_name = \"${{ secrets.DOMAIN_NAME }}\"" >> secrets.auto.tfvars
          echo "aws_region = \"eu-north-1\"" >> secrets.auto.tfvars
          echo "waf_enabled = \"true\"" >> secrets.auto.tfvars

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl -input=false -reconfigure
      
      - name: Terraform Format
        run: |
          terraform fmt -recursive
          find . -name "*.tf" -exec terraform fmt -check -diff {} +
            
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply -input=false -auto-approve tfplan
          rm -f tfplan

      - name: Save Terraform Outputs
        if: github.ref == 'refs/heads/main'
        run: |
          CAPROVER_IP=$(terraform output -raw caprover_instance_ip)
          GITLAB_IP=$(terraform output -raw gitlab_instance_ip)
          CAPROVER_SG_ID=$(terraform output -raw caprover_sg_id)
          GITLAB_SG_ID=$(terraform output -raw gitlab_sg_id)
          ALB_DNS=$(terraform output -raw alb_dns_name)
          VPC_CIDR=$(terraform output -raw vpc_cidr)
          CAPROVER_INSTANCE_ID=$(terraform output -raw caprover_instance_id)
          GITLAB_INSTANCE_ID=$(terraform output -raw gitlab_instance_id)
          
          echo "CAPROVER_IP=$CAPROVER_IP" >> $GITHUB_ENV
          echo "GITLAB_IP=$GITLAB_IP" >> $GITHUB_ENV
          echo "CAPROVER_SG_ID=$CAPROVER_SG_ID" >> $GITHUB_ENV
          echo "GITLAB_SG_ID=$GITLAB_SG_ID" >> $GITHUB_ENV
          echo "ALB_DNS=$ALB_DNS" >> $GITHUB_ENV
          echo "VPC_CIDR=$VPC_CIDR" >> $GITHUB_ENV 
          echo "CAPROVER_INSTANCE_ID=$CAPROVER_INSTANCE_ID" >> $GITHUB_ENV
          echo "GITLAB_INSTANCE_ID=$GITLAB_INSTANCE_ID" >> $GITHUB_ENV

      - name: Test SSM Connection
        run: |
          aws ssm send-command \
            --instance-ids ${{ env.CAPROVER_INSTANCE_ID }} ${{ env.GITLAB_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo SSM connection successful"]' \
            --region eu-north-1
      
      - name: Verify SSM Connection
        run: |
          aws ssm start-session --target ${{ env.GITLAB_INSTANCE_ID }} \
          --document-name AWS-StartInteractiveCommand \
          --parameters '{"command":["echo \"SSM connection successful for GitLab\""]}'
              
          aws ssm start-session --target $CAPROVER_INSTANCE_ID \
            --document-name AWS-StartInteractiveCommand \
            --parameters '{"command":["echo \"SSM connection successful for CapRover\""]}'   

      - name: Create Ansible Inventory
        if: github.ref == 'refs/heads/main'
        working-directory: ansible
        run: |
          # Create properly formatted inventory file
          cat << EOF > inventory.ini
          [caprover]
          ${CAPROVER_INSTANCE_ID} ansible_connection=community.aws.aws_ssm ansible_region=eu-north-1 ansible_ssh_private_key_file=/tmp/dummy_key

          [gitlab]
          ${GITLAB_INSTANCE_ID} ansible_connection=community.aws.aws_ssm ansible_region=eu-north-1 ansible_ssh_private_key_file=/tmp/dummy_key
          EOF
          
          # Verify inventory file
          echo "Inventory created:"
          cat inventory.ini

          # Create dummy key file
          touch /tmp/dummy_key

      - name: Install Ansible Dependencies
        if: github.ref == 'refs/heads/main'
        run: |
          /opt/pipx/venvs/ansible-core/bin/python -m pip install --upgrade boto3
          /opt/pipx/venvs/ansible-core/bin/ansible-galaxy collection install community.aws community.general community.docker --force

      - name: Debug Python Info
        run: |
          echo "Ansible Python path: $(which ansible)"
          echo "System Python path: $(which python)"
          echo "Pip list:"
          pip list
          echo "Ansible environment pip list:"
          /opt/pipx/venvs/ansible-core/bin/python -m pip list

      - name: Verify SSM Agent Status
        run: |
          aws ssm describe-instance-information \
            --instance-information-filter-list key=InstanceIds,valueSet=${{ env.CAPROVER_INSTANCE_ID }} \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text
          
          aws ssm describe-instance-information \
            --instance-information-filter-list key=InstanceIds,valueSet=${{ env.GITLAB_INSTANCE_ID }} \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text


      - name: Update Ansible SSM plugin
        run: |
          /opt/pipx/venvs/ansible-core/bin/python -m pip install --upgrade ansible-pylibssm
      
      - name: Run Ansible Configuration
        if: github.ref == 'refs/heads/main'
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.ini playbook.yml -vv \
            --vault-password-file <(echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}") \
            --extra-vars "domain_name=${{ secrets.DOMAIN_NAME }} vpc_cidr=${{ env.VPC_CIDR }}"

                shred -zu .vault_pass

      - name: Verify  Setup
        run: |
          echo "Checking CapRover health..."
          for i in {1..5}; do curl -I http://${{ env.CAPROVER_IP }}:3000 && break || sleep 5; done
          echo "Checking GitLab health..."
          for i in {1..5}; do curl -I http://${{ env.GITLAB_IP }} && break || sleep 5; done

      - name: Capture instance logs on failure
        if: ${{ failure() }}
        run: |
          echo "===== TERRAFORM STATE ====="
          terraform state list
          
          echo "===== GitLab Workhorse Logs ====="
          ssh ubuntu@${{ env.GITLAB_IP }} "sudo tail -n 100 /var/log/gitlab/gitlab-workhorse/current"
          
          echo "===== GitLab Nginx Error Logs ====="
          ssh ubuntu@${{ env.GITLAB_IP }} "sudo tail -n 100 /var/log/gitlab/nginx/error.log"
          
          echo "===== ALB Target Group Health ====="
          ALB_ARN=$(aws elbv2 describe-load-balancers --names shortlink-alb-prod --query 'LoadBalancers[0].LoadBalancerArn' --output text --region eu-north-1)
          TG_ARN=$(aws elbv2 describe-target-groups --load-balancer-arn $ALB_ARN --query 'TargetGroups[?contains(TargetGroupName, `gitlab`)].TargetGroupArn' --output text --region eu-north-1)
          aws elbv2 describe-target-health --target-group-arn $TG_ARN --region eu-north-1
