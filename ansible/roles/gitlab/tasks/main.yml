- name: Verify SSM connectivity
  wait_for_connection:
    timeout: 120

- name: Check for existing GitLab data
  stat:
    path: /var/opt/gitlab/.gitlab-data-exists
  register: gitlab_data
  become: true

- name: Set GitLab data exists fact
  set_fact:
    gitlab_data_exists: "{{ gitlab_data.stat.exists }}"

- name: Update system (only if no GitLab data exists)
  apt:
    upgrade: dist
    update_cache: true
  when: not gitlab_data_exists

- name: Install prerequisites (only if no data exists)
  apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - postfix
      - ufw
    state: present
  when: not gitlab_data_exists

- name: Install GitLab (only if no data exists)
  shell: |
    curl -sS https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh | bash
    apt-get install -y gitlab-ce
  args:
    creates: /usr/bin/gitlab-ctl
  when: not gitlab_data_exists
  notify: reconfigure gitlab
  retries: 5
  delay: 10

- name: Configure UFW (always apply)
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 22
    - 80
    - 8081
  notify: reload ufw

- name: Configure GitLab settings (always apply)
  blockinfile:
    path: /etc/gitlab/gitlab.rb
    block: |
      external_url 'https://gitlab.{{ domain_name }}'
      nginx['listen_port'] = 8081
      nginx['listen_https'] = false
      nginx['proxy_protocol'] = false
      nginx['real_ip_trusted_addresses'] = ['{{ vpc_cidr }}']
      gitlab_rails['trusted_proxies'] = ['{{ vpc_cidr }}']
      letsencrypt['enable'] = false
      gitlab_workhorse['listen_network'] = "tcp"
      gitlab_workhorse['listen_addr'] = "127.0.0.1:8181"
      puma['worker_processes'] = 2
      sidekiq['max_concurrency'] = 5
      postgresql['shared_buffers'] = "256MB"
      redis['max_memory'] = "100MB"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - PROXY SETTINGS"
  notify: reconfigure gitlab

- name: Flush handlers to apply GitLab configuration
  meta: flush_handlers

- name: Wait for git user creation
  wait_for:
    path: /etc/passwd
    search_regex: "^git:"
    timeout: 120
  when: not gitlab_data_exists

- name: Wait for GitLab service to start
  wait_for:
    host: localhost
    port: 8081
    state: started
    timeout: 300
  become: true
  when: not gitlab_data_exists

- name: Check if root password is set
  become: true
  become_user: git
  command: /opt/gitlab/bin/gitlab-rails runner "puts User.find(1).encrypted_password.blank?"
  register: password_is_blank
  changed_when: false
  when: not gitlab_data_exists

- name: Set root password (only for new installations)
  become: true
  shell: |
    /opt/gitlab/bin/gitlab-rails runner -e production <<EOF
    user = User.find_by(username: 'root')
    user.password = '{{ vault_gitlab_root_password }}'
    user.password_confirmation = '{{ vault_gitlab_root_password }}'
    user.save!
    EOF
  args:
    executable: /bin/bash
  when:
    - not gitlab_data_exists
    - password_is_blank.stdout == "true"
  notify: reconfigure gitlab

- name: Wait for GitLab service after password reset
  wait_for:
    host: localhost
    port: 8081
    state: started
    timeout: 60
  become: true
  when:
    - not gitlab_data_exists
    - password_is_blank.stdout == "true"

- name: Mark GitLab as configured
  file:
    path: /var/opt/gitlab/.gitlab-data-exists
    state: touch
  become: true
  when: not gitlab_data_exists

- name: Verify GitLab health
  uri:
    url: http://localhost:8081/-/health
    status_code: 200
    timeout: 10
  register: gitlab_health
  until: gitlab_health.status == 200
  retries: 30
  delay: 10
  when: not gitlab_data_exists

- name: Ensure GitLab services are running
  systemd:
    name: gitlab-runsvdir
    state: started
    enabled: true
