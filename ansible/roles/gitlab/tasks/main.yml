---
- name: Check if GitLab is installed
  stat:
    path: /usr/bin/gitlab-ctl
  register: gitlab_installed

- name: Update system (if not installed)
  apt:
    upgrade: dist
    update_cache: true
  when: not gitlab_installed.stat.exists

- name: Install prerequisites (if needed)
  apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - postfix
      - ufw
    state: present
  when: not gitlab_installed.stat.exists

- name: Install GitLab (if not installed)
  shell: |
    curl -sS https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh | bash
    apt-get install -y gitlab-ce
  args:
    creates: /usr/bin/gitlab-ctl
  when: not gitlab_installed.stat.exists
  notify: reconfigure gitlab

- name: Reconfigure GitLab
  command: gitlab-ctl reconfigure
  become: true
  when: not gitlab_installed.stat.exists
  register: reconfigure_result

- name: Wait for SSH recovery
  wait_for_connection:
    delay: 45  
    timeout: 900  
  when: not gitlab_installed.stat.exists

- name: Configure UFW (idempotent)
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 22
    - 80
    - 443
    - 8081  # GitLab port
  when: ansible_os_family == "Debian"
  notify: reload ufw

- name: Enable UFW (if not enabled)
  shell: |
    if ufw status | grep -q 'Status: active'; then
      echo "UFW already enabled"
    else
      ufw --force enable
    fi
  args:
    executable: /bin/bash
  when: ansible_os_family == "Debian"
  notify: reload ufw

- name: Debug UFW status
  command: ufw status
  register: ufw_status
  changed_when: false
- debug: var=ufw_status.stdout_lines

- name: Configure GitLab settings (idempotent)
  blockinfile:
    path: /etc/gitlab/gitlab.rb
    block: |
      external_url 'https://gitlab.{{ domain_name }}'
      nginx['listen_port'] = 8081
      nginx['listen_https'] = false
      nginx['proxy_protocol'] = true
      nginx['real_ip_trusted_addresses'] = ['{{ vpc_cidr }}']
      gitlab_rails['trusted_proxies'] = ['{{ vpc_cidr }}']
      letsencrypt['enable'] = false
    marker: "# {mark} ANSIBLE MANAGED BLOCK - PROXY SETTINGS"
  notify: reconfigure gitlab


- name: Wait for SSH recovery
  wait_for_connection:
    delay: 45 
    timeout: 900  
  when: not gitlab_installed.stat.exists

- name: Check if root password is set
  shell: |
    gitlab-rails runner "exit User.find(1).encrypted_password.blank? ? 1 : 0"
  register: password_check
  ignore_errors: true
  changed_when: false

- name: Wait for GitLab to be fully ready
  shell: |
    # Increased timeouts based on manual observation (4+ minutes)
    for i in {1..15}; do
      if gitlab-rails runner "puts 'DB connectedBENCHMARK'" 2>/dev/null; then
        if curl -sIf http://localhost:8081/user/sign_in; then
          if gitlab-rails runner "puts Sidekiq::ProcessSet.new.size > 0"; then
            exit 0
          fi
        fi
      fi
      sleep 30  # Increased from 10 to 30 seconds
    done
    exit 1
  args:
    executable: /bin/bash
  register: gitlab_ready
  until: gitlab_ready.rc == 0
  retries: 3 
  delay: 0

- name: Set root password (only if not set)
  become: yes
  become_user: git
  shell: |
    /opt/gitlab/bin/gitlab-rails runner -e production <<EOF
      user = User.find(1)
      if user.encrypted_password.blank?
        user.password = '{{ vault_gitlab_root_password }}'
        user.password_confirmation = '{{ vault_gitlab_root_password }}'
        user.save!
        puts "Password set successfully"
      else
        puts "Password already set"
      end
    EOF
  no_log: true
  register: password_set
  changed_when: "'Password set successfully' in password_set.stdout"

- name: Wait for SSH to recover after password setting
  wait_for_connection:
    delay: 30
    timeout: 900
  when: password_set.changed

- name: Ensure GitLab services are running
  shell: gitlab-ctl status
  register: gitlab_status
  changed_when: "'run:' not in gitlab_status.stdout"
  failed_when: "'down:' in gitlab_status.stdout"

- name: Verify GitLab health
  uri:
    url: http://localhost:8081/users/sign_in
    status_code: [200, 302]
  register: gitlab_health
  until: gitlab_health.status == 200 or gitlab_health.status == 302
  retries: 10
  delay: 10

- name: Rotate logs instead of truncating
  find:
    paths: /var/log/gitlab
    patterns: "*.log"
    age: "7d"
  register: old_logs

- name: Remove old logs
  file:
    path: "{{ item.path }}"
    state: absent
  with_items: "{{ old_logs.files }}"
  when: old_logs.matched > 0 and ansible_check_mode == false