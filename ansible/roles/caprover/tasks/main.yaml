- name: Verify SSM connectivity
  wait_for_connection:
    timeout: 120

- name: Prepare system for provisioning
  become: true
  block:
    - name: Wait for cloud-init to complete
      become: true
      command: cloud-init status --wait
      register: cloud_init_status
      retries: 30
      delay: 10
      until: "'done' in cloud_init_status.stdout"
      changed_when: false

    - name: Stop unattended upgrades
      systemd:
        name: unattended-upgrades
        state: stopped
      ignore_errors: true

- name: Wait for dpkg lock to be released
  become: true
  shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
      echo "Waiting for dpkg lock to be released..."
      sleep 5
    done
  register: lock_check
  retries: 12
  delay: 5
  until: lock_check.rc == 0
  changed_when: false

- name: Check for existing CapRover data
  stat:
    path: /captain/data/config-captain.yml
  register: caprover_config
  become: true

- name: Set CapRover data exists fact
  set_fact:
    caprover_data_exists: "{{ caprover_config.stat.exists }}"

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - git
      - ufw
      - nodejs
      - npm
      - gnupg-agent
    state: present
    update_cache: true
  when: not caprover_data_exists
  retries: 5
  delay: 30

- name: Create Docker GPG key directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: not caprover_data_exists

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: not caprover_data_exists

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: not caprover_data_exists

- name: Install Docker components
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true 
  when: not caprover_data_exists

- name: Check Docker Swarm state
  command: docker info --format '{% raw %}{{ .Swarm.LocalNodeState }}{% endraw %}'
  register: swarm_state
  changed_when: false
  ignore_errors: true
  become: true

- name: Initialize Docker Swarm if needed
  command: docker swarm init --advertise-addr {{ ansible_default_ipv4.address }}
  when: 
    - swarm_state.stdout | trim != 'active'
    - not caprover_data_exists
  become: true
  register: swarm_init
  changed_when: swarm_init.rc == 0
  failed_when: swarm_init.rc != 0 and "already part of a swarm" not in swarm_init.stderr

- name: Install required Python libraries for Docker
  apt:
    name:
      - docker
      - docker-compose
    state: present

- name: Ensure Docker is running
  systemd:
    name: docker
    state: started
    enabled: true

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
  become: true
  when: not caprover_data_exists

- name: Set Docker socket permissions
  file:
    path: /var/run/docker.sock
    owner: root
    group: docker
    mode: '0660'
  become: true
  when: not caprover_data_exists

- name: Configure and enable UFW
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: 80, proto: tcp }
    - { port: 443, proto: tcp }
    - { port: 3000, proto: tcp }
    - { port: 996, proto: tcp }
    - { port: 7946, proto: tcp }
    - { port: 7946, proto: udp }
    - { port: 4789, proto: udp }
    - { port: 2377, proto: tcp }
    - { port: 22, proto: tcp }

- name: Create CapRover data directory
  file:
    path: /captain/data
    state: directory
    mode: '0755'
  become: true
  when: not caprover_data_exists

- name: Configure CapRover to use existing swarm
  copy:
    content: '{"useExistingSwarm": "true"}'
    dest: /captain/data/config-override.json
  become: true
  when: not caprover_data_exists

- name: Install CapRover using Docker Swarm
  community.docker.docker_swarm_service:
    name: captain-captain
    image: caprover/caprover:{{ caprover_version | default('latest') }}
    publish:
      - published_port: 80
        target_port: 80
        protocol: tcp
        mode: host
      - published_port: 443
        target_port: 443
        protocol: tcp
        mode: host
      - published_port: 3000
        target_port: 3000
        protocol: tcp
        mode: host
    mounts:
      - source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind
      - source: /captain
        target: /captain
        type: bind
    env:
      CAPROVER_ROOT_PASSWORD: "{{ vault_caprover_password }}"
      ACCEPTED_TERMS: "true"
      CAPROVER_ROOT_DOMAIN: "{{ domain_name }}"
      MAIN_NODE_IP_ADDRESS: "{{ ansible_default_ipv4.address }}"
      BY_PASS_PROXY_CHECK: "TRUE"
    restart_config:  
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 60s
    constraints:
      - "node.role==manager"
  become: true
  when: not caprover_data_exists

- name: Configure CapRover to bind to all interfaces
  replace:
    path: /captain/data/config-captain.json
    regexp: '"nginxConfig": {'
    replace: '"nginxConfig": {\n    "serverIp": "0.0.0.0",'
  become: true
  when: not caprover_data_exists
  register: config_updated
  failed_when: false  # Continue even if file not found yet

- name: Wait for configuration to apply.
  wait_for:
    path: /captain/data/config-captain.json
    timeout: 60
  become: true
  when: not caprover_data_exists and config_updated.changed

- name: Restart CapRover service
  command: docker service update --force captain-captain
  become: true
  when: not caprover_data_exists

- name: Start CapRover from existing data
  community.docker.docker_stack:
    name: captain
    state: present
    with_registry_auth: yes
  become: true
  when: caprover_data_exists

- name: Ensure CapRover password is set correctly
  become: true
  block:
    - name: Generate bcrypt hash for new password
      delegate_to: localhost
      run_once: true
      set_fact:
        caprover_password_hash: "{{ vault_caprover_password | password_hash('bcrypt') }}"

    - name: Update CapRover configuration
      replace:
        path: /captain/data/config-captain.json
        regexp: '"hashedPassword":.*'
        replace: '"hashedPassword": "{{ caprover_password_hash }}"'
      register: config_updated

    - name: Restart CapRover if configuration changed
      command: docker service update --force captain-captain
      when: config_updated.changed

    - name: Verify CapRover login
      uri:
        url: http://localhost:3000/api/v2/login
        method: POST
        body_format: json
        body:
          password: "{{ vault_caprover_password }}"
        status_code: 200
        timeout: 10
      register: login_result
      until: login_result.status == 200
      retries: 5
      delay: 5

- name: Verify CapRover API health
  uri:
    url: http://localhost:3000/api/health
    status_code: 200
    timeout: 30
  register: result
  until: result.status == 200
  retries: 60
  delay: 10