---
- name: Debug SSM Connection
  command: echo "SSM connection successful"
  register: ssm_debug
  changed_when: false

- name: Debug SSM Connection Output
  debug:
    var: ssm_debug.stdout

- name: Set Python interpreter
  set_fact:
    ansible_python_interpreter: /usr/bin/python3.8

- name: Check if CapRover is already installed
  stat:
    path: /captain/data/config-captain.json
  register: caprover_installed

- name: Install prerequisites (if not installed)
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - git
      - ufw
    state: present
    update_cache: true
  when: not caprover_installed.stat.exists

- name: Add Node.js repository (if needed)
  shell: |
    curl -sL https://deb.nodesource.com/setup_18.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list
  when: not caprover_installed.stat.exists

- name: Install Node.js (if needed)
  apt:
    name: nodejs
    state: present
    update_cache: true
  when: not caprover_installed.stat.exists

- name: Create Docker GPG key directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: not caprover_installed.stat.exists

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    validate_certs: no
  when: not caprover_installed.stat.exists

- name: Add Docker repository with key verification
  shell: |
    echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] \
    https://download.docker.com/linux/ubuntu \
    {{ ansible_distribution_release }} stable" > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list
  when: not caprover_installed.stat.exists

- name: Force update APT cache
  apt:
    update_cache: true
  when: not caprover_installed.stat.exists

- name: Install Docker components (if needed)
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true
  when: not caprover_installed.stat.exists
  notify: restart docker

- name: Install Docker Compose (if needed)
  get_url:
    url: https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-Linux-x86_64
    dest: /usr/local/bin/docker-compose
    mode: '0755'
  when: not caprover_installed.stat.exists

- name: Ensure Docker is running
  systemd:
    name: docker
    state: started
    enabled: true

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Configure UFW ports (idempotent)
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: 80, proto: tcp }
    - { port: 443, proto: tcp }
    - { port: 3000, proto: tcp }
    - { port: 996, proto: tcp }
    - { port: 7946, proto: tcp }
    - { port: 7946, proto: udp }
    - { port: 4789, proto: udp }
    - { port: 2377, proto: tcp }
    - { port: 22, proto: tcp }
  when: ansible_os_family == "Debian"

- name: Enable UFW (idempotent)
  ufw:
    state: enabled
  when: ansible_os_family == "Debian"

- name: Gather facts to get private IP
  setup:
    gather_subset: network

- name: Leave existing swarm if active
  command: docker swarm leave --force
  ignore_errors: yes

- name: Check Docker Swarm state
  command: docker info --format '{{ .Swarm.LocalNodeState }}'
  register: swarm_state
  changed_when: false
  failed_when: swarm_state.rc != 0

- name: Initialize Docker Swarm
  command: docker swarm init --advertise-addr {{ ansible_default_ipv4.address }}
  when: swarm_state.stdout != 'active'
  register: swarm_init
  failed_when: swarm_init.rc != 0 and 'already part of a swarm' not in swarm_init.stderr

- name: Create CapRover data directory
  file:
    path: /captain/data
    state: directory
    mode: '0755'

- name: Configure CapRover to use existing swarm
  copy:
    content: '{"useExistingSwarm": "true"}'
    dest: /captain/data/config-override.json
    mode: '0644'

- name: Ensure CapRover service is running
  community.docker.docker_swarm_service:
    name: caprover
    image: caprover/caprover
    state: present
    publish:
      - published_port: 80
        target_port: 80
      - published_port: 443
        target_port: 443
      - published_port: 3000
        target_port: 3000
    mounts:
      - source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind
      - source: /captain
        target: /captain
        type: bind
    env:
      CAPROVER_ROOT_PASSWORD: "{{ vault_caprover_password }}"
      MAIN_NODE_IP_ADDRESS: "{{ ansible_default_ipv4.address }}"
  when: swarm_state.stdout == 'active'

- name: Verify CapRover API health
  uri:
    url: http://localhost:3000/api/health
    status_code: 200
  register: result
  until: result.status == 200
  retries: 15
  delay: 20
  when: swarm_state.stdout == 'active'