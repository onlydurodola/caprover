- name: Verify SSM connectivity
  wait_for_connection:
    timeout: 300

- name: Ensure /captain directory exists
  file:
    path: /captain
    state: directory
    mode: '0755'
    owner: ubuntu
    group: ubuntu
  become: true

- name: Check for existing CapRover data
  stat:
    path: /captain/data/config-captain.json
  register: caprover_config
  become: true

- name: Set CapRover data exists fact
  set_fact:
    caprover_data_exists: "{{ caprover_config.stat.exists }}"

- block:
    - name: Clean up any existing Docker artifacts
      shell: |
        docker swarm leave --force || true
        docker system prune -af
        docker volume prune -f
      become: true
      ignore_errors: true

    - name: Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - git
          - ufw
          - nodejs
          - npm
          - gnupg-agent
        state: present
        update_cache: true
      become: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      become: true

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker-ce
      become: true

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
      become: true

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: true
      become: true
      retries: 3
      delay: 5
      register: result
      until: result is success

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
      become: true

    - name: Initialize Docker Swarm
      command: docker swarm init --advertise-addr {{ ansible_default_ipv4.address }}
      become: true
      register: swarm_init
      changed_when: swarm_init.rc == 0
      failed_when: swarm_init.rc != 0 and "already part of a swarm" not in swarm_init.stderr

    - name: Create Docker network
      docker_network:
        name: captain-overlay-network
        driver: overlay
        attachable: yes
      become: true

    - name: Pull required Docker images
      docker_image:
        name: "{{ item }}"
      loop:
        - caprover/caprover:1.14.0
        - caprover/certbot-sleeping:v2.11.0
        - nginx:1.27.2
      become: true

    - name: Create CapRover config
      copy:
        dest: /captain/data/config-captain.json
        content: |
          {
            "namespace": "captain",
            "nginxConfig": {
              "serverIp": "0.0.0.0"
            }
          }
        owner: ubuntu
        group: ubuntu
      become: true

    - name: Create Docker volumes
      docker_volume:
        name: "{{ item }}"
      loop:
        - captain-data
        - captain-nginx-data
      become: true

    - name: Deploy CapRover stack using docker-compose
      community.docker.docker_compose:
        project_src: /captain
        definition:
          version: '3.8'
          services: "{{ docker_compose_services }}"
          networks: "{{ docker_compose_networks }}"
          volumes: "{{ docker_compose_volumes }}"
      become: true
      vars:
        docker_compose_services: |
          captain-captain:
            image: caprover/caprover:1.14.0
            ports:
              - "3000:3000"
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
              - captain-data:/captain
            environment:
              CAPROVER_ROOT_PASSWORD: "{{ vault_caprover_password }}"
              ACCEPTED_TERMS: "true"
              CAPROVER_ROOT_DOMAIN: "{{ domain_name }}"
              MAIN_NODE_IP_ADDRESS: "{{ ansible_default_ipv4.address }}"
              BY_PASS_PROXY_CHECK: "TRUE"
              USE_EXISTING_SWARM: "true"
              SKIP_SWARM_MODE_CHECK: "true"
            networks:
              - captain-overlay-network
            deploy:
              restart_policy:
                condition: on-failure
                delay: 10s
                max_attempts: 5
                window: 60s
          
          captain-certbot:
            image: caprover/certbot-sleeping:v2.11.0
            volumes:
              - captain-data:/captain
            networks:
              - captain-overlay-network
          
          captain-nginx:
            image: nginx:1.27.2
            ports:
              - "80:80"
              - "443:443"
            volumes:
              - captain-nginx-data:/etc/nginx/conf.d
            networks:
              - captain-overlay-network
        
        docker_compose_networks: |
          captain-overlay-network:
            driver: overlay
            attachable: true
        
        docker_compose_volumes: |
          captain-data:
          captain-nginx-data:
          
    - name: Wait for CapRover to start
      wait_for:
        port: 3000
        delay: 10
        timeout: 300
      become: true

    - name: Verify CapRover API health
      uri:
        url: http://localhost:3000/api/v2/health
        status_code: 200
        timeout: 10
      register: result
      until: result.status == 200
      retries: 30
      delay: 10
      become: true

    - name: Set CapRover password
      shell: |
        HASH=$(docker exec $(docker ps -q -f name=captain-captain) \
          node /usr/src/app/node_modules/bcryptjs/bin/bcrypt {{ vault_caprover_password }})
        sed -i "s/\"hashedPassword\":.*/\"hashedPassword\": \"$HASH\"/" /captain/data/config-captain.json
      become: true

    - name: Restart CapRover service
      docker_service:
        name: captain-captain
        state: restarted
      become: true

  when: not caprover_data_exists

- name: Check Docker services
  command: docker service ls
  register: docker_services
  failed_when: false
  become: true

- name: Display Docker services
  debug:
    var: docker_services.stdout_lines

- name: Check CapRover logs
  command: docker service logs captain-captain --tail 50
  register: caprover_logs
  failed_when: false
  become: true

- name: Display CapRover logs
  debug:
    var: caprover_logs.stdout_lines