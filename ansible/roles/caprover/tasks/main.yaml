- name: Verify SSM connectivity
  wait_for_connection:
    timeout: 120

- name: Check if CapRover is already installed
  stat:
    path: /captain/data/config-captain.json
  register: caprover_installed

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - git
      - ufw
      - nodejs
      - npm
      - gnupg-agent
    state: present
    update_cache: true
  when: not caprover_installed.stat.exists
  retries: 5
  delay: 10
  register: apt_install_result
  until: apt_install_result is successful

- name: Create Docker GPG key directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: not caprover_installed.stat.exists

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: not caprover_installed.stat.exists

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: not caprover_installed.stat.exists

- name: Install Docker components
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true 
  when: not caprover_installed.stat.exists

- name: Install required Python libraries for Docker
  apt:
    name:
      - docker
      - docker-compose
    state: present

- name: Ensure Docker is running
  systemd:
    name: docker
    state: started
    enabled: true

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
  become: true
  when: not caprover_installed.stat.exists

- name: Set Docker socket permissions
  file:
    path: /var/run/docker.sock
    owner: root
    group: docker
    mode: '0660'
  become: true
  when: not caprover_installed.stat.exists

- name: Configure and enable UFW
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: 80, proto: tcp }
    - { port: 443, proto: tcp }
    - { port: 3000, proto: tcp }
    - { port: 996, proto: tcp }
    - { port: 7946, proto: tcp }
    - { port: 7946, proto: udp }
    - { port: 4789, proto: udp }
    - { port: 2377, proto: tcp }
    - { port: 22, proto: tcp }

- name: Check Docker Swarm state
  command: docker info --format '{% raw %}{{ .Swarm.LocalNodeState }}{% endraw %}'
  register: swarm_state
  changed_when: false
  ignore_errors: true
  become: true

- name: Initialize Docker Swarm if not active
  command: docker swarm init --advertise-addr {{ ansible_default_ipv4.address }}
  when: swarm_state.stdout | trim != 'active'
  become: true
  register: swarm_init
  changed_when: swarm_init.rc == 0
  failed_when: swarm_init.rc != 0 and "already part of a swarm" not in swarm_init.stderr
  
- name: Create CapRover data directory
  file:
    path: /captain/data
    state: directory
    mode: '0755'
  become: true
  when: not caprover_installed.stat.exists

- name: Configure CapRover to use existing swarm
  copy:
    content: '{"useExistingSwarm": "true"}'
    dest: /captain/data/config-override.json
  become: true
  when: not caprover_installed.stat.exists

- name: Install and start CapRover service using Ansible module
  community.docker.docker_swarm_service:
    name: caprover
    image: caprover/caprover:latest
    networks:
      - name: host
    publish:
      - published_port: 80
        target_port: 80
        protocol: tcp
        mode: host
      - published_port: 443
        target_port: 443
        protocol: tcp
        mode: host
      - published_port: 3000
        target_port: 3000
        protocol: tcp
        mode: host
    mounts:
      - source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind
      - source: /captain
        target: /captain
        type: bind
    env:
      CAPROVER_ROOT_PASSWORD: "{{ vault_caprover_password }}"
      ACCEPTED_TERMS: "true"
      CAPROVER_ROOT_DOMAIN: "{{ domain_name }}"
      MAIN_NODE_IP_ADDRESS: "{{ ansible_default_ipv4.address }}"
    restart_config:  
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 60s
  become: true
  when: not caprover_installed.stat.exists
  
- name: Verify CapRover API health
  uri:
    url: http://localhost:3000/api/health
    status_code: 200
  register: result
  until: result.status == 200
  retries: 30
  delay: 20
  when: not caprover_installed.stat.exists