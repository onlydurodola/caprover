- name: Set Python interpreter
  set_fact:
    ansible_python_interpreter: /usr/bin/python3.8
    


- name: Check if CapRover is already installed
  stat:
    path: /captain/data/config-captain.json
  register: caprover_installed

- name: Install prerequisites (if not installed)
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - git
      - ufw
    state: present
    update_cache: true
  when: not caprover_installed.stat.exists

- name: Add Node.js repository (if needed)
  shell: |
    curl -sL https://deb.nodesource.com/setup_18.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list
  when: not caprover_installed.stat.exists

- name: Install Node.js (if needed)
  apt:
    name: nodejs
    state: present
    update_cache: true
  when: not caprover_installed.stat.exists

- name: Create Docker GPG key directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: 0755
  when: not caprover_installed.stat.exists

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    validate_certs: no
  when: not caprover_installed.stat.exists

- name: Add Docker repository with key verification
  shell: |
    echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] \
    https://download.docker.com/linux/ubuntu \
    {{ ansible_distribution_release }} stable" > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list
  when: not caprover_installed.stat.exists

- name: Force update APT cache
  apt:
    update_cache: true
  when: not caprover_installed.stat.exists

- name: Install Docker components (if needed)
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true
  when: not caprover_installed.stat.exists
  notify: restart docker

- name: Install Docker Compose (if needed)
  get_url:
    url: https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Linux-x86_64
    dest: /usr/local/bin/docker-compose
    mode: '0755'
  when: not caprover_installed.stat.exists

- name: Ensure Docker is running
  systemd:
    name: docker
    state: started
    enabled: true

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
  become: true

- name: Configure UFW ports (idempotent)
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: 80, proto: tcp }
    - { port: 443, proto: tcp }
    - { port: 3000, proto: tcp }
    - { port: 996, proto: tcp }
    - { port: 7946, proto: tcp }
    - { port: 7946, proto: udp }
    - { port: 4789, proto: udp }
    - { port: 2377, proto: tcp }
    - { port: 22, proto: tcp }
  when: ansible_os_family == "Debian"
  notify: reload ufw

- name: Enable UFW (if not enabled)
  shell: |
    if ufw status | grep -q 'Status: active'; then
      echo "UFW already enabled"
    else
      ufw --force enable
    fi
  args:
    executable: /bin/bash
  when: ansible_os_family == "Debian"

- name: Clean up stale CapRover containers
  command: docker rm -f caprover
  ignore_errors: true
  become: true
  when: not caprover_installed.stat.exists

- name: Check if port 2377 is available
  command: netstat -tulnp | grep :2377
  register: port_check
  failed_when: port_check.rc == 0
  ignore_errors: true
  when: not caprover_installed.stat.exists

- name: Reset Docker Swarm if active
  shell: |
    if docker info --format '{{ .Swarm.LocalNodeState }}' | grep -q "active"; then
      docker swarm leave --force
    fi
  when: not caprover_installed.stat.exists
  ignore_errors: true
  become: true

- name: Free up port 2377
  shell: |
    if sudo ss -tulnp | grep ':2377' | grep -q dockerd; then
      echo "Stopping Docker to free port 2377..."
      sudo systemctl stop docker.socket docker.service
      sleep 5
    fi
    sudo ss -tulnp | grep ':2377' | awk '{print $7}' | cut -d\" -f2 | xargs -r kill
    sleep 2
  become: true
  when: not caprover_installed.stat.exists

- name: Restart Docker if stopped
  systemd:
    name: docker
    state: started
    enabled: true
  when: not caprover_installed.stat.exists

- name: Run CapRover in debug mode
  docker_container:
    name: caprover-debug
    image: caprover/caprover
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
      - "996:996"
      - "7946:7946"
      - "7946:7946/udp"
      - "4789:4789/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /captain:/captain
    env:
      CAPROVER_ROOT_PASSWORD: "{{ vault_caprover_password }}"
      CAPROVER_ROOT_DOMAIN: "{{ domain_name }}"
      CAPROVER_ROOT_URL: "http://captain.{{ domain_name }}"
      ACCEPTED_TERMS: "true"
      MAIN_NODE_IP_ADDRESS: "{{ ansible_host }}"
      BY_PASS_PROXY_CHECK: 'TRUE'
    restart_policy: always
    state: started
  register: caprover_run
  ignore_errors: true

- name: Capture CapRover logs
  command: docker logs caprover-debug
  register: caprover_logs
  ignore_errors: true
  become: true

- debug:
    var: caprover_logs.stdout_lines
  when: caprover_run is failed or caprover_logs.stdout != ""

- name: Verify CapRover API health
  uri:
    url: http://localhost:3000/api/health
    status_code: 200
  register: result
  until: result.status == 200
  retries: 10
  delay: 10
  when: not caprover_installed.stat.exists

- name: Check Docker container status
  shell: docker ps -a
  register: docker_ps
  ignore_errors: true

- name: Check CapRover logs
  shell: docker logs caprover-debug
  register: caprover_logs
  ignore_errors: true

- debug:
    var: docker_ps.stdout

- debug:
    var: caprover_logs.stdout

- name: Install CapRover CLI (if needed)
  npm:
    name: caprover
    global: true
    state: present
  when: not caprover_installed.stat.exists

- name: Configure CapRover dashboard
  command: caprover serversetup --caproverUrl https://captain.{{ domain_name }}
  args:
    creates: /captain/data/config-captain.json
  when: not caprover_installed.stat.exists

- name: Verify CapRover health
  shell: |
    for i in {1..30}; do
      if curl -sIf http://localhost:3000 >/dev/null; then
        exit 0
      fi
      sleep 10
    done
    exit 1
  args:
    executable: /bin/bash
  register: health_check
  until: health_check.rc == 0
  retries: 3
  delay: 10

- name: Allow VPC CIDR in UFW
  ufw:
    rule: allow
    src: "{{ vpc_cidr }}"
  changed_when: false