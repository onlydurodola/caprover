- name: Verify SSM connectivity
  wait_for_connection:
    timeout: 120

- name: Check for existing CapRover data
  stat:
    path: /captain/data/config-captain.yml
  register: caprover_config
  become: true

- name: Set CapRover data exists fact
  set_fact:
    caprover_data_exists: "{{ caprover_config.stat.exists }}"

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - git
      - ufw
      - nodejs
      - npm
      - gnupg-agent
    state: present
    update_cache: true
  when: not caprover_data_exists
  retries: 5
  delay: 10
  become: true

- name: Create Docker GPG key directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: not caprover_data_exists
  become: true

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: not caprover_data_exists
  become: true

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: not caprover_data_exists
  become: true

- name: Install Docker components
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true
  when: not caprover_data_exists
  become: true

- name: Check Docker Swarm state
  command: docker info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
  register: swarm_state
  changed_when: false
  ignore_errors: true
  become: true

- name: Initialize Docker Swarm if needed
  command: docker swarm init --advertise-addr {{ ansible_default_ipv4.address }}
  when:
    - swarm_state.stdout | trim != 'active'
    - not caprover_data_exists
  become: true
  register: swarm_init
  changed_when: swarm_init.rc == 0
  failed_when: swarm_init.rc != 0 and "already part of a swarm" not in swarm_init.stderr

- name: Install required Python libraries for Docker.
  apt:
    name:
      - python3-pip
      - docker
      - docker-compose
      - python3-docker
      - python3-requests
    state: present
  become: true

- name: Ensure pip is functional
  command: python3 -m pip --version
  register: pip_version
  changed_when: false
  become: true

- name: Install jsondiff via pip with specific versions
  pip:
    name:
      - jsondiff==2.2.0
    state: present
    executable: /usr/bin/pip3
  become: true
  when: pip_version.rc == 0

- name: Verify Python dependencies on remote host
  command: python3 -c "import {{ item }}"
  loop:
    - docker
    - jsondiff
    - requests
  register: dependency_check
  failed_when: dependency_check.rc != 0
  changed_when: false
  become: true

- name: Install passlib for password hashing
  pip:
    name: passlib
    state: present
  become: true

- name: Ensure Docker is running
  systemd:
    name: docker
    state: started
    enabled: true
  become: true

- name: Create Docker directory structure
  file:
    path: /captain/data
    state: directory
    owner: root
    group: docker
    mode: '0775'
  become: true

- name: Set Docker socket permissions
  file:
    path: /var/run/docker.sock
    owner: root
    group: docker
    mode: '0660'
  become: true

- name: Add ubuntu to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
  become: true

- name: Configure and enable UFW
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: 80, proto: tcp }
    - { port: 443, proto: tcp }
    - { port: 3000, proto: tcp }
    - { port: 996, proto: tcp }
    - { port: 7946, proto: tcp }
    - { port: 7946, proto: udp }
    - { port: 4789, proto: udp }
    - { port: 2377, proto: tcp }
    - { port: 22, proto: tcp }
  become: true

- name: Enable UFW
  ufw:
    state: enabled
  become: true

- name: Ensure CapRover configuration exists
  copy:
    content: |
      {
        "namespace": "captain",
        "nginxConfig": {
          "serverIp": "0.0.0.0"
        }
      }
    dest: /captain/data/config-captain.json
    owner: root
    group: docker
    mode: '0664'
  become: true
  when: not caprover_data_exists

- name: Deploy CapRover service
  community.docker.docker_stack:
    name: captain
    state: present
    with_registry_auth: yes
    compose:
      - version: '3.8'
        services:
          captain-captain:
            image: caprover/caprover:latest
            ports:
              - "80:80"
              - "443:443"
              - "3000:3000"
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
              - /captain:/captain
            environment:
              CAPROVER_ROOT_PASSWORD: "{{ vault_caprover_password }}"
              ACCEPTED_TERMS: "true"
              CAPROVER_ROOT_DOMAIN: "{{ domain_name }}"
              MAIN_NODE_IP_ADDRESS: "{{ ansible_default_ipv4.address }}"
              BY_PASS_PROXY_CHECK: "TRUE"
              USE_EXISTING_SWARM: "true"
            deploy:
              restart_policy:
                condition: on-failure
                delay: 10s
                max_attempts: 5
                window: 60s
  become: true
  when: not caprover_data_exists

- name: Wait for CapRover service to start
  wait_for:
    host: localhost
    port: 3000
    state: started
    timeout: 300
  become: true
  when: not caprover_data_exists

- name: Ensure CapRover password is set correctly
  block:
    - name: Generate bcrypt hash for new password
      delegate_to: localhost
      run_once: true
      set_fact:
        caprover_password_hash: "{{ vault_caprover_password | password_hash('bcrypt') }}"

    - name: Update CapRover configuration with password
      replace:
        path: /captain/data/config-captain.json
        regexp: '"hashedPassword":.*'
        replace: '"hashedPassword": "{{ caprover_password_hash }}"'
      register: config_updated
      become: true

    - name: Restart CapRover if configuration changed
      command: docker service update --force captain-captain
      become: true
      when: config_updated.changed

    - name: Wait for CapRover service to restart
      wait_for:
        host: localhost
        port: 3000
        state: started
        timeout: 60
      become: true
      when: config_updated.changed
  when: not caprover_data_exists

- name: Verify CapRover API health
  uri:
    url: http://localhost:3000/api/v2/health
    status_code: 200
    timeout: 10
  register: result
  until: result.status == 200
  retries: 60
  delay: 10
  become: true
  ignore_errors: true

- name: Capture CapRover logs if health check fails
  shell: docker service logs captain-captain --tail 100 2>&1
  register: caprover_logs
  failed_when: false
  when: result is failed
  become: true

- name: Display CapRover logs
  debug:
    var: caprover_logs.stdout_lines
  when: result is failed

- name: Verify CapRover login
  uri:
    url: http://localhost:3000/api/v2/login
    method: POST
    body_format: json
    body:
      password: "{{ vault_caprover_password }}"
    status_code: 200
    timeout: 10
  register: login_result
  until: login_result.status == 200
  retries: 10
  delay: 10
  become: true
  when: not caprover_data_exists