- hosts: caprover
  vars_files:
    - vault.yml
  become: true
  connection: community.aws.aws_ssm
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: ubuntu
    ansible_ssm_profile: default
    ansible_ssm_executable: /usr/bin/session-manager-plugin
    ansible_ssm_region: eu-north-1
    ansible_ssm_connection_timeout: 300
    ansible_ssm_execution_timeout: 1800
  gather_facts: true
  tasks:
    - name: Wait for SSM connection
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10
      retries: 5
  roles:
    - caprover

