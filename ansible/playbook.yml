- hosts: all
  tasks:
    - name: Ensure vault password is valid
      fail:
        msg: "Vault password contains invalid characters: {{ vault_test | string | regex_replace('^.*$', '*****') }}"
      when: > 
        '"' in vault_caprover_password or 
        '\\' in vault_caprover_password or 
        "'" in vault_caprover_password
      vars:
        vault_test: "{{ vault_caprover_password + vault_gitlab_root_password }}"
      run_once: true

- hosts: caprover
  connection: community.aws.aws_ssm
  vars_files:
    - vault.yml
  become: true
  vars:
    ansible_distribution: Ubuntu
    ansible_os_family: Debian
    ansible_python_interpreter: /usr/bin/python3
    ansible_remote_tmp: /tmp/ansible-$USER
  tasks:
    - name: Pre-run connectivity check
      wait_for_connection:
        timeout: 120
    - name: Ensure /captain directory exists
      file:
        path: /captain
        state: directory
        mode: '0755'
  roles:
    - caprover

- hosts: gitlab
  connection: community.aws.aws_ssm
  vars_files:
    - vault.yml
  become: true
  vars:
    ansible_distribution: Ubuntu
    ansible_os_family: Debian
    ansible_python_interpreter: /usr/bin/python3
    ansible_remote_tmp: /tmp/ansible-$USER
  tasks:
    - name: Pre-run connectivity check
      wait_for_connection:
        timeout: 300
    - name: Test SSM connection
      command: echo "SSM connection successful"
      register: ssm_test
    - debug: var=ssm_test.stdout
    - name: Ensure GitLab data directory exists
      file:
        path: /var/opt/gitlab
        state: directory
        mode: '0755'
  roles:
    - gitlab