- hosts: caprover
  vars_files:
    - vault.yml
  become: true
  connection: community.aws.aws_ssm
  vars:
    ansible_python_interpreter: /opt/pipx/venvs/ansible-core/bin/python
    ansible_user: ubuntu
    ansible_ssm_region: eu-north-1
  roles:
    - caprover

- hosts: gitlab
  vars_files:
    - vault.yml
  become: true
  connection: community.aws.aws_ssm
  vars:
    ansible_python_interpreter: /opt/pipx/venvs/ansible-core/bin/python
    ansible_user: ubuntu
    ansible_ssm_region: eu-north-1
  roles:
    - gitlab