- hosts: caprover
  connection: community.aws.aws_ssm
  vars_files:
    - vault.yml
  become: true
  vars:
    ansible_distribution: Ubuntu
    ansible_os_family: Debian
    ansible_python_interpreter: /usr/bin/python3
    ansible_remote_tmp: /tmp/ansible-$USER
  tasks:
    - name: Pre-run connectivity check
      wait_for_connection:
        timeout: 120
  roles:
    - caprover

- hosts: gitlab
  connection: community.aws.aws_ssm
  vars_files:
    - vault.yml
  become: true
  vars:
    ansible_distribution: Ubuntu
    ansible_os_family: Debian
    ansible_python_interpreter: /usr/bin/python3
    ansible_remote_tmp: /tmp/ansible-$USER
  tasks:
    - name: Pre-run connectivity check
      wait_for_connection:
        timeout: 300
    - name: Test SSM connection
      command: echo "SSM connection successful"
      register: ssm_test
    - debug: var=ssm_test.stdout
  roles:
    - gitlab