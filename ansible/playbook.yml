- hosts: caprover
  vars_files:
    - vault.yml
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: ubuntu
    ansible_ssm_region: eu-north-1
  roles:
    - caprover

- hosts: gitlab
  vars_files:
    - vault.yml
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: ubuntu
    ansible_ssm_region: eu-north-1
  roles:
    - gitlab

