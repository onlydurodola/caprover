- hosts: caprover
  vars_files:
    - vault.yml
  become: true
  connection: aws_ssm
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_become_method: sudo
  roles:
    - caprover

- hosts: gitlab
  vars_files:
    - vault.yml
  become: true
  connection: aws_ssm
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_become_method: sudo
  roles:
    - gitlab